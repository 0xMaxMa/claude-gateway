# Moves the latest dist-tag to a tarball the release workflow already tested. Nothing is rebuilt.
name: Promote to latest

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote to latest, e.g. 2.1.3'
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Preflight checks
        run: scripts/release/promote-check.sh "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Move latest dist-tag
        run: npm dist-tag add "@0xmaxma/claude-gateway@$VERSION" latest
        env:
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Mark GitHub Release as latest
        run: gh release edit "v$VERSION" --prerelease=false --latest
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show dist-tags
        run: npm view @0xmaxma/claude-gateway dist-tags
