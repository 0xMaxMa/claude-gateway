# Moves the stable dist-tag (what `claude-gateway update` installs) to an already-published version.
# Nothing is rebuilt. Run it with `make promote`, or from the Actions tab with a version number.
name: Promote to stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag stable, e.g. 2.1.3 (an older version rolls stable back)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Preflight checks
        run: scripts/release/promote-check.sh "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Move stable dist-tag
        run: npm dist-tag add "@0xmaxma/claude-gateway@$VERSION" stable
        env:
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Show dist-tags
        run: npm view @0xmaxma/claude-gateway dist-tags
