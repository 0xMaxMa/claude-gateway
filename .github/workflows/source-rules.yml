name: Source rules

# Repository rules that a pattern scan can enforce on every change. See AGENTS.md:
# natural-language meaning is never inferred with hardcoded regex or word lists.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'mcp/**'
      - 'lib/**'
      - 'tests/unit/no-semantic-regex.test.ts'
      - '.github/workflows/source-rules.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'mcp/**'
      - 'lib/**'
      - 'tests/unit/no-semantic-regex.test.ts'
      - '.github/workflows/source-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-regex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: No hardcoded semantic regex
        run: npm run lint:semantic-regex -- --ci
